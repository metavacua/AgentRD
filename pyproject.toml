# PEP 621 project metadata for AgentRD — the industry-standard Python manifest.
# The chain preaches manifest-declared dependencies via a recognized standard; this
# project (stdlib-only) declares the empty dependency set explicitly rather than
# hiding behind the `custom` off-list opt-in.

[project]
name = "agentrd"
version = "0.1.0"
description = "Research-Development-Loop (RDL) skill chain: agnostic, manifest-governed, decoupled from the superpowers plugin."
requires-python = ">=3.11"       # tomllib is stdlib from 3.11
dependencies = []                # stdlib-only: tomllib, pathlib, re, json

[project.optional-dependencies]
dev = ["pytest>=7"]              # test runner; not a runtime dependency

[tool.pytest.ini_options]
testpaths = ["skills"]
